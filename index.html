<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CanvasPad Pro - Double Tap Paste & Drag Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      touch-action: none;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
    }
    #bg-canvas { z-index: 1; }
    #image-canvas { z-index: 2; }
    #main-canvas { z-index: 3; }
    #draw-canvas { z-index: 4; }

    /* Custom Live Pen Target Pointer */
    #pen-pointer {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      border: 1.5px solid rgba(79, 70, 229, 0.7);
      background: rgba(79, 70, 229, 0.15);
      transform: translate(-50%, -50%);
      z-index: 40;
      display: none;
      transition: width 0.05s ease, height 0.05s ease;
    }

    /* Area Selection Actions Floating Bar */
    #selection-action-bar {
      position: absolute;
      display: none;
      z-index: 35;
      background: #1e293b;
      border-radius: 12px;
      padding: 4px 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      gap: 4px;
      align-items: center;
      transform: translateY(-100%);
    }
    .sel-action-btn {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .sel-action-btn:hover { background: #334155; }
    .sel-action-btn:active { transform: scale(0.95); }
    .sel-action-btn.del { color: #f87171; }

    /* Draggable Floating Bars */
    .bar {
      position: fixed;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      border-radius: 20px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .drag-handle {
      cursor: grab;
      color: #94a3b8;
      font-size: 16px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      border-radius: 8px;
    }
    .drag-handle:active { cursor: grabbing; background: #e2e8f0; }

    #top-left { top: 16px; left: 16px; }
    #top-mid { top: 16px; left: calc(50vw - 80px); }
    #top-right { top: 16px; right: 16px; }
    #bottom-dock {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      gap: 4px;
      border-radius: 24px;
      max-width: 96vw;
      overflow-x: auto;
    }

    /* Master Clean Mode Button */
    #toggle-ui-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #334155;
      touch-action: none;
      transition: transform 0.2s ease;
    }
    #toggle-ui-btn:active { transform: scale(0.92); }

    body.ui-hidden .bar {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }
    body.ui-hidden .sub-popup, body.ui-hidden #selection-action-bar {
      display: none !important;
    }

    .btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 7px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn.active {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn-icon { padding: 8px 10px; font-size: 16px; }

    #color-trigger {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1.5px #94a3b8;
      display: inline-block;
      flex-shrink: 0;
    }

    #size-trigger {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }
    #size-trigger-preview {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #475569;
    }

    .color-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px #cbd5e1;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .color-dot.active {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px #4f46e5;
    }

    .sub-popup {
      display: none;
      position: fixed;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.14);
      padding: 8px;
      gap: 6px;
      z-index: 30;
    }
    .sub-popup.show { display: flex; }

    #color-popup {
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      width: 220px;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      justify-items: center;
    }
    .custom-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
    }

    #size-popup { flex-direction: column; align-items: center; gap: 8px; min-width: 140px; }
    #size-popup input[type="range"] { width: 120px; accent-color: #4f46e5; cursor: pointer; }

    .popup-btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .popup-btn:active { background: #f1f5f9; }
    .popup-btn.selected { background: #ede9fe; color: #4f46e5; }

    .divider { width: 1px; height: 20px; background: #e2e8f0; margin: 0 2px; }
  </style>
</head>
<body>

  <button id="toggle-ui-btn" title="Toggle Clean Mode">👁</button>
  <div id="pen-pointer"></div>

  <!-- Area Selection Floating Menu (Copy / Paste / Delete) -->
  <div id="selection-action-bar">
    <button class="sel-action-btn" id="act-copy">📋 Copy</button>
    <button class="sel-action-btn" id="act-paste">📄 Paste</button>
    <button class="sel-action-btn del" id="act-del">🗑 Delete</button>
    <button class="sel-action-btn" id="act-close">✕</button>
  </div>

  <!-- Top Left: Pages -->
  <div class="bar" id="top-left">
    <div class="drag-handle" title="Drag me">⋮⋮</div>
    <strong style="color: #4f46e5; font-size: 15px; margin-right: 4px;">CanvasPad</strong>
    <button class="btn btn-icon" id="prev-page">‹</button>
    <span id="page-num" style="font-weight: 700; font-size: 13px; color: #334155;">1/1</span>
    <button class="btn btn-icon" id="next-page">›</button>
    <button class="btn btn-icon" id="add-page">+</button>
    <button class="btn btn-icon" id="del-page" style="color: #ef4444;">🗑</button>
  </div>

  <!-- Top Mid: History -->
  <div class="bar" id="top-mid">
    <div class="drag-handle" title="Drag me">⋮⋮</div>
    <button class="btn btn-icon" id="undo-btn">↶</button>
    <button class="btn btn-icon" id="redo-btn">↷</button>
    <button class="btn btn-icon" id="clear-btn">↺</button>
  </div>

  <!-- Top Right: Image, BG, Export -->
  <div class="bar" id="top-right">
    <div class="drag-handle" title="Drag me">⋮⋮</div>
    <button class="btn" id="import-img-btn">📷 Image</button>
    <input type="file" id="image-input" accept="image/*" style="display: none;">
    <button class="btn" id="bg-btn">Ruled</button>
    <button class="btn" id="export-btn" style="background: #10b981; color: white;">Export ▾</button>
  </div>

  <!-- Export Popup -->
  <div id="export-popup" class="sub-popup" style="flex-direction: column;">
    <button class="popup-btn" id="opt-export-png"><span>🖼</span> Save Current Page (PNG)</button>
    <button class="popup-btn" id="opt-export-pdf"><span>📄</span> Export All Pages (PDF)</button>
  </div>

  <!-- Eraser Popup -->
  <div id="eraser-popup" class="sub-popup" style="flex-direction: column;">
    <button class="popup-btn" id="opt-pixel-eraser"><span>✏️</span> Pixel Eraser</button>
    <button class="popup-btn selected" id="opt-stroke-eraser"><span>🪄</span> Object Eraser</button>
  </div>

  <!-- Shapes Popup -->
  <div id="shapes-popup" class="sub-popup" style="flex-direction: column;">
    <button class="popup-btn selected" data-shape="line"><span>📏</span> Line</button>
    <button class="popup-btn" data-shape="rect"><span>▭</span> Rectangle</button>
    <button class="popup-btn" data-shape="circle"><span>◯</span> Circle</button>
  </div>

  <!-- Color Palette -->
  <div id="color-popup" class="sub-popup">
    <div class="color-grid">
      <div class="color-dot" data-color="#ffffff" title="White" style="background: #ffffff; border: 2px solid #cbd5e1;"></div>
      <div class="color-dot active" data-color="#1e293b" title="Black" style="background: #1e293b;"></div>
      <div class="color-dot" data-color="#3b82f6" title="Blue" style="background: #3b82f6;"></div>
      <div class="color-dot" data-color="#06b6d4" title="Cyan" style="background: #06b6d4;"></div>
      <div class="color-dot" data-color="#10b981" title="Green" style="background: #10b981;"></div>
      <div class="color-dot" data-color="#84cc16" title="Lime" style="background: #84cc16;"></div>

      <div class="color-dot" data-color="#eab308" title="Yellow" style="background: #eab308;"></div>
      <div class="color-dot" data-color="#f97316" title="Orange" style="background: #f97316;"></div>
      <div class="color-dot" data-color="#ef4444" title="Red" style="background: #ef4444;"></div>
      <div class="color-dot" data-color="#ec4899" title="Pink" style="background: #ec4899;"></div>
      <div class="color-dot" data-color="#8b5cf6" title="Purple" style="background: #8b5cf6;"></div>
      <div class="color-dot" data-color="#64748b" title="Slate Gray" style="background: #64748b;"></div>
    </div>
    <div class="custom-color-row">
      <span>Custom Palette</span>
      <input type="color" id="custom-color-input" value="#1e293b">
    </div>
  </div>

  <!-- Size Popup -->
  <div id="size-popup" class="sub-popup">
    <div style="font-size: 11px; font-weight: 700; color: #64748b;">STROKE THICKNESS: <span id="size-val">6</span>px</div>
    <input type="range" id="brush-size" min="2" max="60" value="6">
  </div>

  <!-- Bottom Dock -->
  <div class="bar" id="bottom-dock">
    <div class="drag-handle" title="Drag me">⋮⋮</div>
    <button class="btn" id="tool-select">✂️ Select</button>
    <button class="btn active" id="tool-pen">Pen</button>
    <button class="btn" id="tool-highlighter">Highlight</button>
    <button class="btn" id="tool-eraser">Eraser (Obj)</button>
    <button class="btn" id="tool-shape">Shapes ▾</button>
    <button class="btn" id="tool-laser">🔴 Laser</button>

    <div class="divider"></div>

    <div id="color-trigger" title="Change Color" style="background: #1e293b;"></div>
    <div id="size-trigger" title="Change Size">
      <div id="size-trigger-preview"></div>
      <span id="size-trigger-text">6</span>
    </div>
  </div>

  <!-- Multi-Layer Canvas Architecture -->
  <div id="canvas-container">
    <canvas id="bg-canvas"></canvas>
    <canvas id="image-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
  </div>

  <script>
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const imgCanvas = document.getElementById('image-canvas');
    const imgCtx = imgCanvas.getContext('2d');
    const mainCanvas = document.getElementById('main-canvas');
    const mainCtx = mainCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');

    const penPointer = document.getElementById('pen-pointer');
    const selActionBar = document.getElementById('selection-action-bar');

    let currentTool = 'pen';
    let currentShape = 'line';
    let eraserMode = 'object';
    let currentColor = '#1e293b';
    let brushSize = 6;
    let bgMode = 'ruled';

    let pages = [ { strokes: [], images: [], redoStack: [] } ];
    let currentPageIndex = 0;
    let selectedImageIndex = -1;
    let isDrawing = false;
    let activeStroke = null;
    let imgDragState = null;

    // Advanced Clipboard and Active Selection System
    let clipboardData = null; // { strokes: [], images: [], bounds: {x,y,w,h} }
    let selectionBox = null;  // { x, y, w, h }
    let selectedStrokes = []; // References to strokes currently inside selection
    let isSelectingArea = false;
    let isMovingSelection = false;
    let moveStartPos = { x: 0, y: 0 };

    // Double-Tap Detection State
    let lastTapTime = 0;
    let lastTapPos = { x: 0, y: 0 };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      [bgCanvas, imgCanvas, mainCanvas, drawCanvas].forEach(c => {
        c.width = Math.floor(w * dpr);
        c.height = Math.floor(h * dpr);
        c.style.width = w + 'px';
        c.style.height = h + 'px';
        const ctx = c.getContext('2d');
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
      });

      renderBackground();
      redrawAll();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 150));

    function renderBackground(targetCtx = bgCtx, targetW = window.innerWidth, targetH = window.innerHeight) {
      targetCtx.clearRect(0, 0, targetW, targetH);

      if (bgMode === 'dark') {
        targetCtx.fillStyle = '#0f172a';
        targetCtx.fillRect(0, 0, targetW, targetH);
        return;
      }

      targetCtx.fillStyle = '#ffffff';
      targetCtx.fillRect(0, 0, targetW, targetH);

      if (bgMode === 'ruled') {
        targetCtx.strokeStyle = '#e2e8f0';
        targetCtx.lineWidth = 1.2;
        const step = 34;
        targetCtx.beginPath();
        for (let y = step; y <= targetH; y += step) {
          targetCtx.moveTo(0, y);
          targetCtx.lineTo(targetW, y);
        }
        targetCtx.stroke();
      } else if (bgMode === 'grid') {
        targetCtx.strokeStyle = '#f1f5f9';
        targetCtx.lineWidth = 1;
        const step = 28;
        targetCtx.beginPath();
        for (let x = 0; x <= targetW; x += step) {
          targetCtx.moveTo(x, 0); targetCtx.lineTo(x, targetH);
        }
        for (let y = 0; y <= targetH; y += step) {
          targetCtx.moveTo(0, y); targetCtx.lineTo(targetW, y);
        }
        targetCtx.stroke();
      }
    }

    function renderImages(targetCtx = imgCtx, isExporting = false) {
      targetCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      const page = pages[currentPageIndex];

      page.images.forEach((imgItem, idx) => {
        if (imgItem.element && imgItem.element.complete) {
          targetCtx.drawImage(imgItem.element, imgItem.x, imgItem.y, imgItem.w, imgItem.h);

          if (idx === selectedImageIndex && !isExporting) {
            targetCtx.save();
            targetCtx.strokeStyle = '#4f46e5';
            targetCtx.lineWidth = 2;
            targetCtx.strokeRect(imgItem.x, imgItem.y, imgItem.w, imgItem.h);

            targetCtx.fillStyle = '#ffffff';
            targetCtx.strokeStyle = '#4f46e5';
            targetCtx.lineWidth = 2.5;
            targetCtx.beginPath();
            targetCtx.arc(imgItem.x + imgItem.w, imgItem.y + imgItem.h, 9, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.fillStyle = '#ef4444';
            targetCtx.beginPath();
            targetCtx.arc(imgItem.x + imgItem.w, imgItem.y, 11, 0, Math.PI * 2);
            targetCtx.fill();
            targetCtx.fillStyle = '#ffffff';
            targetCtx.font = 'bold 12px sans-serif';
            targetCtx.textAlign = 'center';
            targetCtx.textBaseline = 'middle';
            targetCtx.fillText('✕', imgItem.x + imgItem.w, imgItem.y);
            targetCtx.restore();
          }
        }
      });
    }

    function renderStroke(ctx, item) {
      ctx.save();
      ctx.beginPath();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = item.color;
      ctx.lineWidth = item.size;

      if (item.type === 'highlighter') {
        ctx.globalAlpha = 0.35;
        ctx.globalCompositeOperation = 'multiply';
      } else if (item.type === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      }

      if (item.type === 'pen' || item.type === 'highlighter' || item.type === 'eraser') {
        if (item.points.length < 2) return ctx.restore();
        ctx.moveTo(item.points[0].x, item.points[0].y);
        for (let i = 1; i < item.points.length; i++) {
          ctx.lineTo(item.points[i].x, item.points[i].y);
        }
        ctx.stroke();
      } else if (item.type === 'shape') {
        const { startX, startY, endX, endY, shape } = item;
        if (shape === 'line') {
          ctx.moveTo(startX, startY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
        } else if (shape === 'rect') {
          ctx.strokeRect(startX, startY, endX - startX, endY - startY);
        } else if (shape === 'circle') {
          const rx = (endX - startX) / 2;
          const ry = (endY - startY) / 2;
          const cx = startX + rx;
          const cy = startY + ry;
          ctx.ellipse(cx, cy, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function redrawStrokes() {
      mainCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      const page = pages[currentPageIndex];
      page.strokes.forEach(s => renderStroke(mainCtx, s));
    }

    function redrawAll() {
      renderImages();
      redrawStrokes();
    }

    // Render Selection Box & Floating Controls
    function drawSelectionMarquee() {
      drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (!selectionBox) return;

      drawCtx.save();
      drawCtx.strokeStyle = '#4f46e5';
      drawCtx.lineWidth = 1.8;
      drawCtx.setLineDash([6, 4]);
      drawCtx.strokeRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
      drawCtx.fillStyle = 'rgba(79, 70, 229, 0.08)';
      drawCtx.fillRect(selectionBox.x, selectionBox.y, selectionBox.w, selectionBox.h);
      drawCtx.restore();

      selActionBar.style.display = 'flex';
      let topY = selectionBox.y - 12;
      if (topY < 60) topY = selectionBox.y + selectionBox.h + 42;
      let leftX = Math.max(10, Math.min(window.innerWidth - 230, selectionBox.x));
      selActionBar.style.top = topY + 'px';
      selActionBar.style.left = leftX + 'px';
    }

    function clearSelection() {
      selectionBox = null;
      selectedStrokes = [];
      isSelectingArea = false;
      isMovingSelection = false;
      selActionBar.style.display = 'none';
      drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    // Calculate Bounding Box of Strokes to Allow Easy Selection by Direct Touch
    function getStrokeBounds(stroke) {
      if (stroke.points && stroke.points.length > 0) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        stroke.points.forEach(pt => {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
        });
        const pad = stroke.size || 6;
        return { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };
      } else if (stroke.type === 'shape') {
        const minX = Math.min(stroke.startX, stroke.endX) - 5;
        const maxX = Math.max(stroke.startX, stroke.endX) + 5;
        const minY = Math.min(stroke.startY, stroke.endY) - 5;
        const maxY = Math.max(stroke.startY, stroke.endY) + 5;
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
      }
      return null;
    }

    function distToSegment(p, v, w) {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function eraseStrokesAtPoint(x, y, radius) {
      const page = pages[currentPageIndex];
      const initialCount = page.strokes.length;

      page.strokes = page.strokes.filter(item => {
        const threshold = (item.size / 2) + radius;
        if (item.points) {
          for (let i = 0; i < item.points.length - 1; i++) {
            if (distToSegment({ x, y }, item.points[i], item.points[i + 1]) <= threshold) return false;
          }
        } else if (item.type === 'shape') {
          if (item.shape === 'line') {
            if (distToSegment({ x, y }, { x: item.startX, y: item.startY }, { x: item.endX, y: item.endY }) <= threshold) return false;
          } else {
            const minX = Math.min(item.startX, item.endX) - threshold;
            const maxX = Math.max(item.startX, item.endX) + threshold;
            const minY = Math.min(item.startY, item.endY) - threshold;
            const maxY = Math.max(item.startY, item.endY) + threshold;
            if (x >= minX && x <= maxX && y >= minY && y <= maxY) return false;
          }
        }
        return true;
      });

      if (page.strokes.length !== initialCount) {
        page.redoStack = [];
        redrawStrokes();
      }
    }

    function updatePenPointer(x, y) {
      if (currentTool === 'pen' || currentTool === 'highlighter' || currentTool === 'eraser' || currentTool === 'laser') {
        penPointer.style.display = 'block';
        penPointer.style.left = x + 'px';
        penPointer.style.top = y + 'px';

        if (currentTool === 'laser') {
          penPointer.style.width = '14px';
          penPointer.style.height = '14px';
          penPointer.style.borderColor = '#ef4444';
          penPointer.style.background = '#ef4444';
          penPointer.style.boxShadow = '0 0 12px 2px rgba(239, 68, 68, 0.9)';
        } else {
          const sz = (currentTool === 'highlighter') ? Math.max(brushSize * 2.2, 24) : brushSize;
          penPointer.style.width = Math.max(sz, 8) + 'px';
          penPointer.style.height = Math.max(sz, 8) + 'px';
          penPointer.style.borderColor = (currentTool === 'eraser') ? '#94a3b8' : (currentColor === '#ffffff' ? '#94a3b8' : currentColor);
          penPointer.style.background = (currentTool === 'eraser') ? 'rgba(148, 163, 184, 0.25)' : (currentColor === '#ffffff' ? 'rgba(255,255,255,0.4)' : currentColor + '22');
          penPointer.style.boxShadow = 'none';
        }
      } else {
        penPointer.style.display = 'none';
      }
    }

    // Function to Paste Clipboard Content at Target Coordinate
    function pasteAtLocation(targetX, targetY) {
      if (!clipboardData) return;
      const page = pages[currentPageIndex];
      const bounds = clipboardData.bounds;

      const offsetX = targetX - bounds.x;
      const offsetY = targetY - bounds.y;

      const newlyPastedStrokes = [];

      if (clipboardData.strokes && clipboardData.strokes.length > 0) {
        clipboardData.strokes.forEach(s => {
          if (s.points) {
            const newStroke = {
              type: s.type,
              color: s.color,
              size: s.size,
              points: s.points.map(pt => ({
                x: pt.x + offsetX,
                y: pt.y + offsetY
              }))
            };
            page.strokes.push(newStroke);
            newlyPastedStrokes.push(newStroke);
          } else if (s.type === 'shape') {
            const newShape = {
              ...s,
              startX: s.startX + offsetX,
              startY: s.startY + offsetY,
              endX: s.endX + offsetX,
              endY: s.endY + offsetY
            };
            page.strokes.push(newShape);
            newlyPastedStrokes.push(newShape);
          }
        });
      }

      // Automatically select the newly pasted content so user can immediately drag/move it!
      selectionBox = {
        x: targetX,
        y: targetY,
        w: bounds.w,
        h: bounds.h
      };
      selectedStrokes = newlyPastedStrokes;
      drawSelectionMarquee();
      redrawAll();
    }

    const container = document.getElementById('canvas-container');

    container.addEventListener('pointermove', (e) => {
      updatePenPointer(e.clientX, e.clientY);

      if (currentTool === 'select') {
        if (isSelectingArea) {
          const x = Math.min(activeStroke.startX, e.clientX);
          const y = Math.min(activeStroke.startY, e.clientY);
          const w = Math.abs(e.clientX - activeStroke.startX);
          const h = Math.abs(e.clientY - activeStroke.startY);
          selectionBox = { x, y, w, h };
          drawSelectionMarquee();
          return;
        }

        // Live Moving / Dragging the Selected Content Across Canvas
        if (isMovingSelection && selectionBox) {
          const dx = e.clientX - moveStartPos.x;
          const dy = e.clientY - moveStartPos.y;

          selectionBox.x += dx;
          selectionBox.y += dy;

          // Shift all currently selected strokes in real-time
          selectedStrokes.forEach(s => {
            if (s.points) {
              s.points.forEach(pt => {
                pt.x += dx;
                pt.y += dy;
              });
            } else if (s.type === 'shape') {
              s.startX += dx;
              s.startY += dy;
              s.endX += dx;
              s.endY += dy;
            }
          });

          moveStartPos = { x: e.clientX, y: e.clientY };
          drawSelectionMarquee();
          redrawStrokes();
          return;
        }

        if (imgDragState) {
          e.preventDefault();
          const page = pages[currentPageIndex];
          const img = page.images[selectedImageIndex];
          if (!img) return;

          const dx = e.clientX - imgDragState.startX;
          const dy = e.clientY - imgDragState.startY;

          if (imgDragState.mode === 'move') {
            img.x = imgDragState.origX + dx;
            img.y = imgDragState.origY + dy;
          } else if (imgDragState.mode === 'resize') {
            const newW = Math.max(60, imgDragState.origW + dx);
            const ratio = imgDragState.origH / imgDragState.origW;
            img.w = newW;
            img.h = newW * ratio;
          }
          renderImages();
          return;
        }
        return;
      }

      if (!isDrawing) return;
      e.preventDefault();
      const x = e.clientX;
      const y = e.clientY;

      if (currentTool === 'laser') {
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawCtx.beginPath();
        drawCtx.arc(x, y, 6, 0, Math.PI * 2);
        drawCtx.fillStyle = '#ef4444';
        drawCtx.shadowColor = '#ef4444';
        drawCtx.shadowBlur = 10;
        drawCtx.fill();
        return;
      }

      if (currentTool === 'eraser' && eraserMode === 'object') {
        eraseStrokesAtPoint(x, y, brushSize / 2);
        return;
      }

      if (currentTool === 'shape') {
        activeStroke.endX = x;
        activeStroke.endY = y;
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        renderStroke(drawCtx, activeStroke);
      } else {
        activeStroke.points.push({ x, y });
        if (currentTool === 'eraser') {
          renderStroke(mainCtx, {
            type: 'eraser',
            size: activeStroke.size,
            points: [activeStroke.points[activeStroke.points.length - 2], { x, y }]
          });
        } else {
          drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          renderStroke(drawCtx, activeStroke);
        }
      }
    });

    container.addEventListener('pointerdown', (e) => {
      closeAllPopups();
      const x = e.clientX;
      const y = e.clientY;
      const now = Date.now();

      // ========================================================
      // DOUBLE-TAP GESTURE: PASTE AT TOUCHED LOCATION
      // ========================================================
      if (now - lastTapTime < 320 && Math.hypot(x - lastTapPos.x, y - lastTapPos.y) < 30) {
        lastTapTime = 0;
        if (clipboardData) {
          pasteAtLocation(x, y);
          return;
        }
      }
      lastTapTime = now;
      lastTapPos = { x, y };

      // ========================================================
      // SELECT TOOL INTERACTIONS
      // ========================================================
      if (currentTool === 'select') {
        // 1. If clicking inside existing active selection box -> Start Dragging
        if (selectionBox && x >= selectionBox.x && x <= selectionBox.x + selectionBox.w &&
            y >= selectionBox.y && y <= selectionBox.y + selectionBox.h) {
          isMovingSelection = true;
          moveStartPos = { x, y };
          return;
        }

        // 2. Direct Tap Selection: If user simply taps on any written stroke, auto-select it!
        const page = pages[currentPageIndex];
        let tappedStroke = null;
        for (let i = page.strokes.length - 1; i >= 0; i--) {
          const s = page.strokes[i];
          const b = getStrokeBounds(s);
          if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            tappedStroke = s;
            selectionBox = { ...b };
            selectedStrokes = [s];
            break;
          }
        }

        if (tappedStroke) {
          isMovingSelection = true;
          moveStartPos = { x, y };
          drawSelectionMarquee();
          return;
        }

        // 3. Check Images
        if (selectedImageIndex !== -1) {
          const selImg = page.images[selectedImageIndex];
          if (selImg && Math.hypot(x - (selImg.x + selImg.w), y - selImg.y) <= 18) {
            page.images.splice(selectedImageIndex, 1);
            selectedImageIndex = -1;
            renderImages();
            return;
          }
          if (selImg && Math.hypot(x - (selImg.x + selImg.w), y - (selImg.y + selImg.h)) <= 18) {
            imgDragState = {
              mode: 'resize',
              startX: x, startY: y,
              origW: selImg.w, origH: selImg.h
            };
            return;
          }
        }

        let clickedImgIdx = -1;
        for (let i = page.images.length - 1; i >= 0; i--) {
          const img = page.images[i];
          if (x >= img.x && x <= img.x + img.w && y >= img.y && y <= img.y + img.h) {
            clickedImgIdx = i;
            break;
          }
        }

        if (clickedImgIdx !== -1) {
          clearSelection();
          selectedImageIndex = clickedImgIdx;
          const img = page.images[clickedImgIdx];
          imgDragState = {
            mode: 'move',
            startX: x, startY: y,
            origX: img.x, origY: img.y
          };
          renderImages();
          return;
        }

        // 4. Start Marquee Area Drag
        clearSelection();
        isSelectingArea = true;
        activeStroke = { startX: x, startY: y };
        selectionBox = { x, y, w: 0, h: 0 };
        return;
      }

      // Drawing Tools
      isDrawing = true;
      if (currentTool === 'laser') return;

      if (currentTool === 'eraser' && eraserMode === 'object') {
        eraseStrokesAtPoint(x, y, brushSize / 2);
        return;
      }

      if (currentTool === 'shape') {
        activeStroke = {
          type: 'shape',
          shape: currentShape,
          color: currentColor,
          size: brushSize,
          startX: x, startY: y, endX: x, endY: y
        };
      } else {
        const dynamicSize = (currentTool === 'highlighter') ? Math.max(brushSize * 2.5, 24) : brushSize;
        activeStroke = {
          type: currentTool,
          color: currentColor,
          size: dynamicSize,
          points: [{ x, y }]
        };
      }

      if (currentTool !== 'eraser') {
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        renderStroke(drawCtx, activeStroke);
      } else {
        renderStroke(mainCtx, activeStroke);
      }
    });

    function finishAction() {
      if (currentTool === 'select') {
        if (isSelectingArea) {
          isSelectingArea = false;
          if (selectionBox && (selectionBox.w < 12 || selectionBox.h < 12)) {
            clearSelection();
          } else if (selectionBox) {
            // Find all strokes that fall inside this drawn selection box
            const minX = selectionBox.x;
            const maxX = selectionBox.x + selectionBox.w;
            const minY = selectionBox.y;
            const maxY = selectionBox.y + selectionBox.h;

            const page = pages[currentPageIndex];
            selectedStrokes = page.strokes.filter(s => {
              if (s.points) {
                return s.points.some(pt => pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY);
              } else if (s.type === 'shape') {
                return Math.min(s.startX, s.endX) < maxX && Math.max(s.startX, s.endX) > minX &&
                       Math.min(s.startY, s.endY) < maxY && Math.max(s.startY, s.endY) > minY;
              }
              return false;
            });
          }
        }
        if (isMovingSelection) {
          isMovingSelection = false;
        }
        if (imgDragState) {
          imgDragState = null;
        }
        return;
      }

      if (currentTool === 'laser') drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (!isDrawing) return;
      isDrawing = false;

      if (currentTool === 'eraser' && eraserMode === 'object') return;

      if (activeStroke) {
        pages[currentPageIndex].strokes.push(activeStroke);
        pages[currentPageIndex].redoStack = [];

        renderStroke(mainCtx, activeStroke);
        drawCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
      activeStroke = null;
    }

    container.addEventListener('pointerup', finishAction);
    container.addEventListener('pointercancel', finishAction);
    container.addEventListener('pointerleave', () => {
      penPointer.style.display = 'none';
      finishAction();
    });

    // Copy Button Handler
    document.getElementById('act-copy').onclick = () => {
      if (!selectionBox || selectionBox.w <= 0 || selectionBox.h <= 0) return;
      const minX = selectionBox.x;
      const maxX = selectionBox.x + selectionBox.w;
      const minY = selectionBox.y;
      const maxY = selectionBox.y + selectionBox.h;

      const page = pages[currentPageIndex];
      const copiedStrokes = [];

      page.strokes.forEach(s => {
        if (s.points && s.points.length > 0) {
          const inside = s.points.some(pt => pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY);
          if (inside) {
            copiedStrokes.push({
              type: s.type,
              color: s.color,
              size: s.size,
              points: s.points.map(pt => ({ x: pt.x, y: pt.y }))
            });
          }
        } else if (s.type === 'shape') {
          copiedStrokes.push({ ...s });
        }
      });

      clipboardData = {
        strokes: copiedStrokes,
        bounds: { ...selectionBox }
      };

      const copyBtn = document.getElementById('act-copy');
      copyBtn.textContent = '✔ Copied! (Double Tap to Paste)';
      setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1600);
    };

    // Paste Button Handler
    document.getElementById('act-paste').onclick = () => {
      if (!clipboardData) {
        alert('Please select an area and copy first!');
        return;
      }
      const targetX = selectionBox ? selectionBox.x + 30 : 100;
      const targetY = selectionBox ? selectionBox.y + 30 : 100;
      pasteAtLocation(targetX, targetY);
    };

    // Delete Button Handler
    document.getElementById('act-del').onclick = () => {
      if (!selectionBox) return;
      const minX = selectionBox.x;
      const maxX = selectionBox.x + selectionBox.w;
      const minY = selectionBox.y;
      const maxY = selectionBox.y + selectionBox.h;

      const page = pages[currentPageIndex];
      page.strokes = page.strokes.filter(stroke => {
        if (!stroke.points || stroke.points.length === 0) return true;
        const inside = stroke.points.some(pt => pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY);
        return !inside;
      });

      clearSelection();
      redrawStrokes();
    };

    document.getElementById('act-close').onclick = () => {
      clearSelection();
    };

    // Draggable Toolbars
    function makeElementDraggable(elm, handleSelector) {
      let isDragging = false;
      let startX, startY, origLeft, origTop;
      const targetHandle = handleSelector ? elm.querySelector(handleSelector) : elm;
      if (!targetHandle) return;

      targetHandle.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;

        const rect = elm.getBoundingClientRect();
        origLeft = rect.left;
        origTop = rect.top;

        elm.style.transform = 'none';
        elm.style.right = 'auto';
        elm.style.bottom = 'auto';
        elm.style.left = origLeft + 'px';
        elm.style.top = origTop + 'px';

        targetHandle.setPointerCapture(e.pointerId);
        e.stopPropagation();
      });

      targetHandle.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        let newX = Math.max(8, Math.min(window.innerWidth - elm.offsetWidth - 8, origLeft + dx));
        let newY = Math.max(8, Math.min(window.innerHeight - elm.offsetHeight - 8, origTop + dy));

        elm.style.left = newX + 'px';
        elm.style.top = newY + 'px';
        e.stopPropagation();
      });

      const stopDrag = (e) => {
        if (isDragging) {
          isDragging = false;
          try { targetHandle.releasePointerCapture(e.pointerId); } catch(err){}
        }
      };

      targetHandle.addEventListener('pointerup', stopDrag);
      targetHandle.addEventListener('pointercancel', stopDrag);
    }

    document.querySelectorAll('.bar').forEach(bar => makeElementDraggable(bar, '.drag-handle'));
    makeElementDraggable(document.getElementById('toggle-ui-btn'), null);

    const toggleUiBtn = document.getElementById('toggle-ui-btn');
    let isUiHidden = false;

    toggleUiBtn.onclick = (e) => {
      e.stopPropagation();
      isUiHidden = !isUiHidden;
      document.body.classList.toggle('ui-hidden', isUiHidden);
      toggleUiBtn.textContent = isUiHidden ? '👁‍🗨' : '👁';
    };

    const selectBtn = document.getElementById('tool-select');
    const penBtn = document.getElementById('tool-pen');
    const highBtn = document.getElementById('tool-highlighter');
    const eraserBtn = document.getElementById('tool-eraser');
    const shapeBtn = document.getElementById('tool-shape');
    const laserBtn = document.getElementById('tool-laser');
    const exportBtn = document.getElementById('export-btn');

    const colorTrigger = document.getElementById('color-trigger');
    const sizeTrigger = document.getElementById('size-trigger');

    const eraserPopup = document.getElementById('eraser-popup');
    const shapesPopup = document.getElementById('shapes-popup');
    const exportPopup = document.getElementById('export-popup');
    const colorPopup = document.getElementById('color-popup');
    const sizePopup = document.getElementById('size-popup');

    function positionPopup(popup, anchorElm, preferTop = true) {
      const rect = anchorElm.getBoundingClientRect();
      const popupHeight = popup.offsetHeight || 120;
      let top = preferTop ? (rect.top - popupHeight - 12) : (rect.bottom + 10);
      if (top < 10) top = rect.bottom + 10;
      if (top + popupHeight > window.innerHeight) top = rect.top - popupHeight - 12;

      let left = rect.left - 10;
      if (left + 230 > window.innerWidth) left = window.innerWidth - 240;

      popup.style.top = top + 'px';
      popup.style.left = Math.max(10, left) + 'px';
    }

    function closeAllPopups() {
      eraserPopup.classList.remove('show');
      shapesPopup.classList.remove('show');
      exportPopup.classList.remove('show');
      colorPopup.classList.remove('show');
      sizePopup.classList.remove('show');
    }

    function setActiveTool(tool) {
      currentTool = tool;
      [selectBtn, penBtn, highBtn, eraserBtn, shapeBtn, laserBtn].forEach(b => b.classList.remove('active'));
      if (tool === 'select') selectBtn.classList.add('active');
      if (tool === 'pen') penBtn.classList.add('active');
      if (tool === 'highlighter') highBtn.classList.add('active');
      if (tool === 'eraser') eraserBtn.classList.add('active');
      if (tool === 'shape') shapeBtn.classList.add('active');
      if (tool === 'laser') laserBtn.classList.add('active');

      if (tool !== 'select') {
        selectedImageIndex = -1;
        clearSelection();
        renderImages();
      }
      closeAllPopups();
    }

    selectBtn.onclick = () => setActiveTool('select');
    penBtn.onclick = () => setActiveTool('pen');
    highBtn.onclick = () => setActiveTool('highlighter');
    laserBtn.onclick = () => setActiveTool('laser');

    eraserBtn.onclick = () => {
      if (currentTool === 'eraser') {
        const isShown = eraserPopup.classList.contains('show');
        closeAllPopups();
        if (!isShown) {
          positionPopup(eraserPopup, eraserBtn, true);
          eraserPopup.classList.add('show');
        }
      } else {
        setActiveTool('eraser');
      }
    };

    shapeBtn.onclick = () => {
      if (currentTool === 'shape') {
        const isShown = shapesPopup.classList.contains('show');
        closeAllPopups();
        if (!isShown) {
          positionPopup(shapesPopup, shapeBtn, true);
          shapesPopup.classList.add('show');
        }
      } else {
        setActiveTool('shape');
        positionPopup(shapesPopup, shapeBtn, true);
        shapesPopup.classList.add('show');
      }
    };

    exportBtn.onclick = (e) => {
      e.stopPropagation();
      const isShown = exportPopup.classList.contains('show');
      closeAllPopups();
      if (!isShown) {
        positionPopup(exportPopup, exportBtn, false);
        exportPopup.classList.add('show');
      }
    };

    colorTrigger.onclick = (e) => {
      e.stopPropagation();
      const isShown = colorPopup.classList.contains('show');
      closeAllPopups();
      if (!isShown) {
        positionPopup(colorPopup, colorTrigger, true);
        colorPopup.classList.add('show');
      }
    };

    sizeTrigger.onclick = (e) => {
      e.stopPropagation();
      const isShown = sizePopup.classList.contains('show');
      closeAllPopups();
      if (!isShown) {
        positionPopup(sizePopup, sizeTrigger, true);
        sizePopup.classList.add('show');
      }
    };

    document.querySelectorAll('#shapes-popup .popup-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#shapes-popup .popup-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentShape = btn.dataset.shape;
        shapeBtn.textContent = `${btn.textContent.trim()} ▾`;
        shapesPopup.classList.remove('show');
      };
    });

    document.getElementById('opt-pixel-eraser').onclick = () => {
      eraserMode = 'pixel';
      document.getElementById('opt-pixel-eraser').classList.add('selected');
      document.getElementById('opt-stroke-eraser').classList.remove('selected');
      eraserBtn.textContent = 'Eraser (Px)';
      eraserPopup.classList.remove('show');
    };

    document.getElementById('opt-stroke-eraser').onclick = () => {
      eraserMode = 'object';
      document.getElementById('opt-stroke-eraser').classList.add('selected');
      document.getElementById('opt-pixel-eraser').classList.remove('selected');
      eraserBtn.textContent = 'Eraser (Obj)';
      eraserPopup.classList.remove('show');
    };

    function applyColor(color) {
      currentColor = color;
      colorTrigger.style.background = currentColor;
      if (currentTool === 'eraser' || currentTool === 'select') setActiveTool('pen');
    }

    document.querySelectorAll('#color-popup .color-dot').forEach(dot => {
      dot.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('#color-popup .color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        applyColor(dot.dataset.color);
        colorPopup.classList.remove('show');
      };
    });

    const customColorInput = document.getElementById('custom-color-input');
    customColorInput.addEventListener('input', (e) => {
      document.querySelectorAll('#color-popup .color-dot').forEach(d => d.classList.remove('active'));
      applyColor(e.target.value);
    });

    const brushSlider = document.getElementById('brush-size');
    const sizeVal = document.getElementById('size-val');
    const sizeTriggerText = document.getElementById('size-trigger-text');
    const sizePreviewDot = document.getElementById('size-trigger-preview');

    ['pointerdown', 'touchstart', 'mousedown'].forEach(evt => {
      brushSlider.addEventListener(evt, (e) => e.stopPropagation(), { passive: true });
    });

    brushSlider.addEventListener('input', (e) => {
      brushSize = parseInt(e.target.value);
      sizeVal.textContent = brushSize;
      sizeTriggerText.textContent = brushSize;
      const previewDiameter = Math.min(14, Math.max(4, brushSize));
      sizePreviewDot.style.width = previewDiameter + 'px';
      sizePreviewDot.style.height = previewDiameter + 'px';
    });

    const importImgBtn = document.getElementById('import-img-btn');
    const imageInput = document.getElementById('image-input');

    importImgBtn.onclick = () => imageInput.click();

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const maxW = window.innerWidth * 0.6;
          const maxH = window.innerHeight * 0.6;
          let w = img.width;
          let h = img.height;

          if (w > maxW) { h = (maxW / w) * h; w = maxW; }
          if (h > maxH) { w = (maxH / h) * w; h = maxH; }

          const x = (window.innerWidth - w) / 2;
          const y = (window.innerHeight - h) / 2;

          pages[currentPageIndex].images.push({
            element: img,
            x: x, y: y, w: w, h: h
          });
          selectedImageIndex = pages[currentPageIndex].images.length - 1;
          setActiveTool('select');
          renderImages();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      imageInput.value = '';
    });

    document.getElementById('undo-btn').onclick = () => {
      const page = pages[currentPageIndex];
      if (page.strokes.length > 0) {
        page.redoStack.push(page.strokes.pop());
        redrawStrokes();
      }
    };

    document.getElementById('redo-btn').onclick = () => {
      const page = pages[currentPageIndex];
      if (page.redoStack.length > 0) {
        page.strokes.push(page.redoStack.pop());
        redrawStrokes();
      }
    };

    document.getElementById('clear-btn').onclick = () => {
      pages[currentPageIndex].strokes = [];
      pages[currentPageIndex].redoStack = [];
      redrawStrokes();
    };

    const pageNumText = document.getElementById('page-num');
    function updatePageIndicator() {
      pageNumText.textContent = `${currentPageIndex + 1}/${pages.length}`;
    }

    document.getElementById('add-page').onclick = () => {
      pages.push({ strokes: [], images: [], redoStack: [] });
      currentPageIndex = pages.length - 1;
      selectedImageIndex = -1;
      clearSelection();
      updatePageIndicator();
      redrawAll();
    };

    document.getElementById('prev-page').onclick = () => {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        selectedImageIndex = -1;
        clearSelection();
        updatePageIndicator();
        redrawAll();
      }
    };

    document.getElementById('next-page').onclick = () => {
      if (currentPageIndex < pages.length - 1) {
        currentPageIndex++;
        selectedImageIndex = -1;
        clearSelection();
        updatePageIndicator();
        redrawAll();
      }
    };

    document.getElementById('del-page').onclick = () => {
      if (pages.length > 1) {
        pages.splice(currentPageIndex, 1);
        if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;
        selectedImageIndex = -1;
        clearSelection();
        updatePageIndicator();
        redrawAll();
      }
    };

    const bgBtn = document.getElementById('bg-btn');
    const bgModes = ['ruled', 'grid', 'blank', 'dark'];
    bgBtn.onclick = () => {
      const nextIdx = (bgModes.indexOf(bgMode) + 1) % bgModes.length;
      bgMode = bgModes[nextIdx];
      bgBtn.textContent = bgMode.charAt(0).toUpperCase() + bgMode.slice(1);
      
      if (bgMode === 'dark' && currentColor === '#1e293b') {
        applyColor('#ffffff');
      } else if (bgMode !== 'dark' && currentColor === '#ffffff') {
        applyColor('#1e293b');
      }

      renderBackground();
    };

    function renderPageToCanvas(pageObj) {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = mainCanvas.width;
      exportCanvas.height = mainCanvas.height;
      const expCtx = exportCanvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;

      expCtx.scale(dpr, dpr);
      renderBackground(expCtx, window.innerWidth, window.innerHeight);

      pageObj.images.forEach(imgItem => {
        if (imgItem.element && imgItem.element.complete) {
          expCtx.drawImage(imgItem.element, imgItem.x, imgItem.y, imgItem.w, imgItem.h);
        }
      });

      pageObj.strokes.forEach(s => renderStroke(expCtx, s));
      return exportCanvas;
    }

    document.getElementById('opt-export-png').onclick = () => {
      exportPopup.classList.remove('show');
      const canvasToSave = renderPageToCanvas(pages[currentPageIndex]);
      const link = document.createElement('a');
      link.download = `CanvasPad-Page-${currentPageIndex + 1}.png`;
      link.href = canvasToSave.toDataURL('image/png');
      link.click();
    };

    document.getElementById('opt-export-pdf').onclick = async () => {
      exportPopup.classList.remove('show');
      const { jsPDF } = window.jspdf;
      
      const isLandscape = window.innerWidth > window.innerHeight;
      const orientation = isLandscape ? 'landscape' : 'portrait';
      
      const pdf = new jsPDF({
        orientation: orientation,
        unit: 'px',
        format: [window.innerWidth, window.innerHeight]
      });

      for (let i = 0; i < pages.length; i++) {
        if (i > 0) pdf.addPage([window.innerWidth, window.innerHeight], orientation);
        const renderedCanvas = renderPageToCanvas(pages[i]);
        const imgData = renderedCanvas.toDataURL('image/jpeg', 0.95);
        pdf.addImage(imgData, 'JPEG', 0, 0, window.innerWidth, window.innerHeight);
      }

      pdf.save('CanvasPad-Notes.pdf');
    };

    resize();
    updatePageIndicator();
  </script>
</body>
</html>

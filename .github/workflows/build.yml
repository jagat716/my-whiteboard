name: Build Android App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Assets Folder
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -r * www/ 2>/dev/null || true

      - name: Install Dependencies & Add Android
        run: |
          npm install
          npx cap add android

      - name: Sync Code
        run: npx cap sync android

      - name: Compile APK & AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
